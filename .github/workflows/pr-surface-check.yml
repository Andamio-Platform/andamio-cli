name: PR Surface Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  surface-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Compare CLI command surface + JSON schema against baseline
        run: go run ./cmd/andamio compare

      - name: Check CHANGELOG.md was updated
        run: go run ./cmd/andamio changelog-check
