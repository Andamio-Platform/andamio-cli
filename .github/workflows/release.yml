name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Build provenance: id-token signs the attestation through Sigstore, and
  # attestations stores it where `gh attestation verify` finds it.
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # CHANGELOG.md is the source of truth for user-facing release notes.
      # Without this, GoReleaser generates the release body from commit
      # subjects — which for a release whose headline change is a removal
      # would lead with the removal, telling the people least affected that
      # the tool is being wound down. Fails the job if the section is missing
      # rather than publishing a blank or autogenerated body.
      #
      # The notes file is written OUTSIDE the checkout ($RUNNER_TEMP): GoReleaser
      # refuses to run on a dirty tree, and an untracked release-notes.md in the
      # repo root is exactly that — the v1.0.0 tag's first run failed at 0s
      # with "git is in a dirty state: ?? release-notes.md" before publishing
      # anything.
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/changelog-section.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          echo "Release notes for $VERSION:"
          cat "$RUNNER_TEMP/release-notes.md"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Exact version so the code that runs at release time only changes
          # with a commit here. v1.3.0 was built with this version.
          version: "v2.19.0"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Publishes provenance for every downloadable file. Attestations live in
      # GitHub's attestation store, keyed by digest, so this runs after the
      # release is published and works with immutable releases. Verify with:
      #   gh attestation verify <file> --repo Andamio-Platform/andamio-cli
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
