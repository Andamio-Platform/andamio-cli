version: 2

builds:
  - main: ./cmd/andamio
    binary: andamio
    # Reproducible builds: no build-machine paths, and every timestamp comes
    # from the tagged commit rather than the wall clock, so building the same
    # tag twice gives the same archives. The archive entries below need the
    # same treatment.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "andamio_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # mod_timestamp only fixes the binary on disk. Archive entries otherwise
    # carry the checkout time of the docs and the runner's user, so a rebuild
    # from a fresh checkout would produce different archive bytes.
    builds_info:
      mtime: "{{ .CommitDate }}"
      owner: root
      group: root
    files:
      - src: "{README,LICENSE,CHANGELOG}*"
        info:
          mtime: "{{ .CommitDate }}"
          owner: root
          group: root
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

# The release workflow passes --release-notes=release-notes.md, extracted from
# CHANGELOG.md, and that takes precedence over this block. Kept as the fallback
# for a local `goreleaser release` run without the flag; disabling it entirely
# would leave such a run with no notes at all.
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - repository:
      owner: Andamio-Platform
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      # The tap's main requires a PR, so each release opens one instead of pushing.
      pull_request:
        enabled: true
    # Skip publishing the cask for prerelease tags (e.g. vX.Y.Z-rc.1) so a
    # prerelease never becomes the `brew install` default and validation/test
    # tags can't push a broken cask to the public tap. Real vX.Y.Z tags publish
    # as before.
    skip_upload: "auto"
    homepage: "https://github.com/Andamio-Platform/andamio-cli"
    description: "CLI for the Andamio Protocol"
    binaries:
      - andamio
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/andamio"]
          end

release:
  github:
    owner: Andamio-Platform
    name: andamio-cli
  # draft: false still uploads into a draft and publishes at the end. GoReleaser
  # 2.x always creates the release as a draft, uploads every asset, then
  # publishes, which is what immutable releases require. Do not downgrade
  # below the version pinned in release.yml without rechecking that.
  draft: false
  prerelease: auto
