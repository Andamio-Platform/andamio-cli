name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # CHANGELOG.md is the source of truth for user-facing release notes.
      # Without this, GoReleaser generates the release body from commit
      # subjects — which for a release whose headline change is a removal
      # would lead with the removal, telling the people least affected that
      # the tool is being wound down. Fails the job if the section is missing
      # rather than publishing a blank or autogenerated body.
      #
      # The notes file is written OUTSIDE the checkout ($RUNNER_TEMP): GoReleaser
      # refuses to run on a dirty tree, and an untracked release-notes.md in the
      # repo root is exactly that — the v1.0.0 tag's first run failed at 0s
      # with "git is in a dirty state: ?? release-notes.md" before publishing
      # anything.
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/changelog-section.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          echo "Release notes for $VERSION:"
          cat "$RUNNER_TEMP/release-notes.md"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
